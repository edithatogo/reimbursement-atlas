version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dashboard-dependencies:
        patterns: ["*"]
    ignore:
      # The scheduled compatibility canary opens the upgrade path once Astro's
      # checker peer contract explicitly admits TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
