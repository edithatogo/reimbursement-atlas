name: GitHub security settings monitor

on:
  schedule:
    - cron: "23 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-security-settings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Read repository security settings
        env:
          # GITHUB_TOKEN cannot read all repository security-analysis settings.
          # An optional fine-grained token may provide administration:read only.
          GH_TOKEN: ${{ secrets.GH_SECURITY_SETTINGS_TOKEN || github.token }}
        run: uv run --all-extras python scripts/check_github_security_settings.py --repo "$GITHUB_REPOSITORY"
      - name: Normalize external governance evidence
        run: uv run --all-extras python scripts/make_governance_monitor_report.py
      - name: Upload redacted settings evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-security-settings-${{ github.run_id }}
          path: |
            data/derived/repo_automation/github_security_settings.json
            data/derived/governance_monitoring/
          if-no-files-found: error
          retention-days: 30
      - name: Keep issue 191 synchronized with live state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report=data/derived/repo_automation/github_security_settings.json
          test -f "$report"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$report")"
          body="$(cat "$report")"
          body="$(printf 'Live readback from %s/%s/actions/runs/%s:\n\n%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$body")"
          if [ "$status" = "pass" ] || [ "$status" = "external_capability_unavailable" ]; then
            gh issue close 191 --comment "$body" || true
          else
            gh issue edit 191 --body "$(printf '%s\n\n%s' 'Automated live security-settings monitor.' "$body")"
          fi
