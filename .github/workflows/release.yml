name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Require release governance gates
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pixi run release-readiness
          pixi run archive-publication-gate
          pixi run public-data-policy
          pixi run licence-review-validate
          pixi run action-pin-policy
          pixi run zenodo-metadata
          pixi run zenodo-draft
          pixi run release-identity --tag "$GITHUB_REF_NAME"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Generate SBOMs
        run: pixi run sbom
      - name: Build package
        run: uv build
      - name: Generate archive
        run: |
          archive_name="reimbursement-atlas-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --output="$archive_name" HEAD
      - name: Generate deterministic release manifest
        run: |
          python scripts/make_release_manifest.py \
            --output release-manifest.json \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --artifact dist/* \
            --artifact reimbursement-atlas-*.tar.gz \
            --artifact data/derived/sbom/*.json
      - name: Validate release asset identity
        run: |
          pixi run zenodo-metadata
          pixi run zenodo-draft --release-assets
          args=(--tag "$GITHUB_REF_NAME")
          for artifact in dist/* reimbursement-atlas-*.tar.gz; do
            args+=(--asset "$artifact")
          done
          pixi run release-identity "${args[@]}"
      - name: Attest Python distributions
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*
      - name: Attest source archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: reimbursement-atlas-*.tar.gz
      - name: Attest SBOMs
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: data/derived/sbom/*.json
      - name: Attest release manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-manifest.json
      - name: Verify release attestations before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          mkdir -p data/derived/attestations
          for artifact in dist/* reimbursement-atlas-*.tar.gz data/derived/sbom/*.json release-manifest.json; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json \
              > "data/derived/attestations/$(basename "$artifact").json"
          done
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/*
            reimbursement-atlas-*.tar.gz
            data/derived/sbom/*.json
            data/derived/attestations/*.json
            release-manifest.json
