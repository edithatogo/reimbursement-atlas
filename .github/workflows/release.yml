name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable tag to release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
        # Commit-bound review receipts require ancestry validation.
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Require release governance gates
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          pixi run release-readiness
          # Software release is independent of research/archive readiness.
          # Zenodo/DataCite retains the stricter archive-publication gate.
          test "$(jq -r '.repository_release_ready' data/derived/release_readiness/summary.json)" = "true"
          pixi run public-data-policy
          pixi run licence-review-validate
          pixi run action-pin-policy
          pixi run zenodo-metadata
          pixi run zenodo-draft
          pixi run release-identity --tag "$RELEASE_TAG"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Generate SBOMs
        run: pixi run sbom
      - name: Build package
        run: pixi run build
      - name: Generate archive
        run: |
          archive_name="reimbursement-atlas-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --output="$archive_name" HEAD
      - name: Generate deterministic release manifest
        run: |
          python scripts/make_release_manifest.py \
            --output release-manifest.json \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz \
            --artifact reimbursement-atlas-*.tar.gz \
            --artifact data/derived/sbom/*.json
      - name: Validate release asset identity
        run: |
          pixi run zenodo-metadata
          pixi run zenodo-draft --release-assets
          args=(--tag "$RELEASE_TAG")
          for artifact in dist/*.whl dist/*.tar.gz reimbursement-atlas-*.tar.gz; do
            args+=(--asset "$artifact")
          done
          pixi run release-identity "${args[@]}"
      - name: Attest Python distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: reimbursement-atlas-*.tar.gz
      - name: Attest SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: data/derived/sbom/*.json
      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-manifest.json
      - name: Verify release attestations before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          mkdir -p data/derived/attestations
          for artifact in dist/*.whl dist/*.tar.gz reimbursement-atlas-*.tar.gz data/derived/sbom/*.json release-manifest.json; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json \
              > "data/derived/attestations/$(basename "$artifact").json"
          done
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            reimbursement-atlas-*.tar.gz
            data/derived/sbom/*.json
            data/derived/attestations/*.json
            release-manifest.json
