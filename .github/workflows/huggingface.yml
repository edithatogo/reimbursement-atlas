name: Hugging Face publication

on:
  workflow_dispatch:
    inputs:
      publish_dataset:
        description: "Publish licence-safe derived dataset to Hugging Face"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_space:
        description: "Publish static Astro dashboard to Hugging Face Space"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  validate-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Regenerate publication manifests
        run: |
          uv run python scripts/sync_seed_csvs.py
          uv run python scripts/check_public_data_policy.py
          uv run python scripts/make_publication_manifest.py
          uv run python scripts/make_research_package.py
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
      - name: Validate publication bundle
        run: uv run --all-extras python scripts/check_huggingface_bundle.py
      - name: Upload publication candidate artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huggingface-publication-candidate
          path: |
            data/derived/publication_manifest.json
            data/derived/research_package/
            infra/huggingface/
            apps/dashboard/dist/

  publish-dataset:
    needs: validate-publication
    if: ${{ github.event.inputs.publish_dataset == 'true' }}
    runs-on: ubuntu-latest
    environment: publication-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Validate gates before dataset publication
        run: |
          uv sync --all-extras
          uv run python scripts/check_public_data_policy.py
          uv run python scripts/make_publication_manifest.py
          uv run python scripts/check_huggingface_publication_gates.py
      - name: Push dataset artefacts to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_DATASET_REPO"
          git -c http.extraheader="Authorization: Bearer $HF_TOKEN" \
            clone "https://huggingface.co/datasets/${HF_DATASET_REPO}" hf-dataset
          git -C hf-dataset config http.https://huggingface.co/.extraheader "Authorization: Bearer $HF_TOKEN"
          git -C hf-dataset remote set-url origin "https://huggingface.co/datasets/${HF_DATASET_REPO}"
          rsync -av --delete --exclude='.git/' infra/huggingface/ hf-dataset/
          mkdir -p hf-dataset/data/seed hf-dataset/data/derived
          rsync -av data/seed/*.csv hf-dataset/data/seed/
          rsync -av data/seed/*.jsonl hf-dataset/data/seed/
          rsync -av data/derived/publication_manifest.json hf-dataset/data/derived/
          cd hf-dataset
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish reimbursement atlas derived dataset" || exit 0
          cat > "$RUNNER_TEMP/hf-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "hf" ;;
            *) printf '%s\n' "$HF_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/hf-askpass"
          git remote set-url origin "https://huggingface.co/datasets/${HF_DATASET_REPO}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            GIT_ASKPASS="$RUNNER_TEMP/hf-askpass" GIT_TERMINAL_PROMPT=0 \
              git fetch --unshallow origin main
          else
            GIT_ASKPASS="$RUNNER_TEMP/hf-askpass" GIT_TERMINAL_PROMPT=0 \
              git fetch origin main
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          git push --force-with-lease="refs/heads/main:$(git rev-parse FETCH_HEAD)" \
            "https://hf:${HF_TOKEN}@huggingface.co/datasets/${HF_DATASET_REPO}" HEAD:main

  publish-space:
    needs: validate-publication
    if: ${{ github.event.inputs.publish_space == 'true' }}
    runs-on: ubuntu-latest
    environment: publication-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build Space bundle
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
      - name: Validate Space bundle
        working-directory: .
        run: |
          uv run --all-extras python scripts/check_huggingface_bundle.py
          uv run --all-extras python scripts/check_huggingface_publication_gates.py
      - name: Push dashboard to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE_REPO"
          git -c http.extraheader="Authorization: Bearer $HF_TOKEN" \
            clone "https://huggingface.co/spaces/${HF_SPACE_REPO}" hf-space
          git -C hf-space config http.https://huggingface.co/.extraheader "Authorization: Bearer $HF_TOKEN"
          git -C hf-space remote set-url origin "https://huggingface.co/spaces/${HF_SPACE_REPO}"
          rsync -av --delete --exclude='.git/' apps/dashboard/dist/ hf-space/
          cp infra/huggingface/SPACE_README.md hf-space/README.md
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy reimbursement atlas dashboard" || exit 0
          cat > "$RUNNER_TEMP/hf-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "hf" ;;
            *) printf '%s\n' "$HF_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/hf-askpass"
          git remote set-url origin "https://huggingface.co/spaces/${HF_SPACE_REPO}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            GIT_ASKPASS="$RUNNER_TEMP/hf-askpass" GIT_TERMINAL_PROMPT=0 \
              git fetch --unshallow origin main
          else
            GIT_ASKPASS="$RUNNER_TEMP/hf-askpass" GIT_TERMINAL_PROMPT=0 \
              git fetch origin main
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          git push --force-with-lease="refs/heads/main:$(git rev-parse FETCH_HEAD)" \
            "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" HEAD:main
