name: Workflow security analysis

on:
  # Required branch-protection contexts must be emitted for every pull request;
  # path filtering here can leave workflow-policy and zizmor permanently pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "pyproject.toml"
      - "pixi.lock"
  schedule:
    - cron: "23 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Generate repository automation policy matrix
        run: pixi run repo-automation
      - name: Generate action SHA resolution evidence
        run: pixi run action-pin-resolution || true
      - name: Enforce immutable external action references
        run: pixi run action-pin-policy
      - name: Upload workflow policy artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-policy
          path: data/derived/repo_automation/
          retention-days: 14

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run zizmor GitHub Actions audit
        run: |
          uv tool run zizmor==1.26.1 --min-severity medium --format sarif .github > zizmor.sarif
      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: zizmor.sarif
