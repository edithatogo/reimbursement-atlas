name: Workflow security analysis

on:
  # Required branch-protection contexts must be emitted for every pull request;
  # path filtering here can leave workflow-policy and zizmor permanently pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "pyproject.toml"
      - "pixi.lock"
  schedule:
    - cron: "23 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - name: Generate repository automation policy matrix
        run: pixi run repo-automation
      - name: Generate action SHA resolution evidence
        run: pixi run action-pin-resolution || true
      - name: Enforce immutable external action references
        run: pixi run action-pin-policy
      - name: Upload workflow policy artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-policy
          path: data/derived/repo_automation/
          retention-days: 14

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run zizmor GitHub Actions audit
        run: |
          uv tool run zizmor==1.26.1 --min-severity medium --format sarif .github > zizmor.sarif
      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: zizmor.sarif
