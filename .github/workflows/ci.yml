name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Validate seed data
        run: pixi run seed-validate
      - name: Validate seed CSV mirrors
        run: pixi run seed-sync-check
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format-check
      - name: Type check
        run: pixi run typecheck
      - name: Public data policy
        run: pixi run public-data-policy
      - name: Citation metadata
        run: pixi run citation-validate
      - name: Public documentation claims
        run: pixi run public-docs
      - name: Documentation freshness report
        run: pixi run docs-freshness
      - name: Policy demonstrator fixtures
        run: pixi run policy-demonstrators
      - name: Mapping calibration contract
        run: pixi run mapping-calibration
      - name: Repository automation matrix
        run: pixi run repo-automation
      - name: Generate SBOMs
        run: pixi run sbom
      - name: Architecture report
        run: pixi run architecture-report
      - name: Release readiness matrix
        run: pixi run release-readiness || true
      - name: Tests with coverage
        run: pixi run coverage
      - name: External quality-gate classification
        run: pixi run external-quality-gates

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
      - name: Audit dashboard production dependencies
        working-directory: apps/dashboard
        run: npm audit --omit=dev --audit-level=moderate

  python314-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Show runtime target
        run: python --version
      - name: Sync dependencies
        run: uv sync --all-extras --prerelease=allow
      - name: Validate seed data
        run: uv run --all-extras python scripts/validate_seed_data.py
      - name: Validate seed CSV mirrors
        run: uv run --all-extras python scripts/validate_seed_sync.py
      - name: Validate public data policy
        run: uv run --all-extras python scripts/check_public_data_policy.py
      - name: Validate CLI
        run: uv run --all-extras python -m reimburse_atlas.cli validate
      - name: Mojo smoke
        run: uv run --all-extras bash scripts/run_mojo_smoke.sh
      - name: Mojo/Python parity report
        run: uv run --all-extras python scripts/make_mojo_parity_report.py
      - name: Fuzzy prefilter benchmark
        run: uv run --all-extras python scripts/make_fuzzy_prefilter_benchmark.py
