name: Harness assurance

on:
  # Required property, integration, E2E and deterministic-regeneration
  # contexts must not be left pending on documentation-only pull requests.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layered-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: [property, integration, e2e]
    env:
      HARNESS: ${{ matrix.harness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Run bounded harness
        run: pixi run "$HARNESS"

  deterministic-regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Regenerate deterministic evidence surfaces
        run: |
          set -euo pipefail
          pixi run schema-export
          pixi run graph-seed
          pixi run readiness
          pixi run ingestion-plan
          pixi run acquisition-plan
          pixi run vertical-slice
          pixi run source-snapshots
          pixi run repo-automation
          pixi run sbom
          pixi run architecture-report
          pixi run source-validation
          pixi run source-contracts
          pixi run medallion-projection
          pixi run medallion-federation
          pixi run historical-sources
          pixi run local-quality
          pixi run dataset-candidate-assessments
          pixi run project-issues
          pixi run github-project-export
          pixi run protocol-status
          pixi run roadmap-linkages
          pixi run data-quality
          pixi run data-dictionary
          pixi run research-claim-packages
          pixi run evidence-readiness
          pixi run source-drift
          pixi run governance-monitoring
          pixi run release-readiness || true
          pixi run field-lineage
          pixi run backfill-replay
          pixi run research-package
          pixi run final-handoff
          pixi run licence-review-queue
          # Reconcile checksum-bound decisions after queue regeneration so this
          # workflow matches the repository automation canonical sequence.
          pixi run licence-review-reconcile
          pixi run licence-review-validate
          pixi run licence-decision-matrix
          pixi run review-schemas
          pixi run local-parser-contracts
          pixi run mapping-power-calculation
          pixi run mapping-candidate-frame
          pixi run mapping-active-review-packets
          pixi run mapping-active-review-ledger
          pixi run mapping-active-adjudication
          pixi run mapping-active-split
          pixi run mapping-active-evaluation
          pixi run mapping-cycle-registry
          pixi run fuzzy-benchmark
          pixi run seed-lake
          pixi run dashboard-seed
          # Generate status only after the final checksum-bound queue exists.
          pixi run dashboard-status
          pixi run zenodo-draft
          pixi run zenodo-deposition-plan
          # Release readiness reads dashboard evidence while dashboard data also
          # renders release receipts. Reconcile once after every displayed input
          # has settled so the clean-tree assertion observes the fixed point,
          # rather than a valid but transient intermediate state.
          for reconciliation_pass in 1 2; do
            echo "release receipt reconciliation pass ${reconciliation_pass}/2"
            pixi run release-readiness
            pixi run final-handoff
            pixi run source-drift
            pixi run field-lineage
            pixi run backfill-replay
            pixi run research-package
            pixi run seed-lake
            pixi run dashboard-seed
            pixi run dashboard-status
            pixi run zenodo-draft
            pixi run zenodo-deposition-plan
          done
      - name: Capture generated parity diagnostics
        if: always()
        run: |
          git diff --binary > generated-parity.diff || true
          pixi info > generated-pixi-info.txt || true
          pixi run python --version > generated-python-version.txt 2>&1 || true
      - name: Upload generated parity diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-parity-diagnostics
          path: |
            generated-parity.diff
            generated-pixi-info.txt
            generated-python-version.txt
      - name: Require a clean deterministic regeneration
        run: git diff --exit-code
