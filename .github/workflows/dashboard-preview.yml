name: Dashboard preview build

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "data/seed/**"
      - "data/derived/vertical_slice/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Generate dashboard seed data
        run: |
          pixi run graph-seed
          pixi run readiness
          pixi run ingestion-plan
          pixi run acquisition-plan
          pixi run vertical-slice
          pixi run source-snapshots
          pixi run repo-automation
          pixi run sbom
          pixi run architecture-report
          pixi run dashboard-seed
      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Install Playwright browser engines
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
      - name: Validate dashboard public quality
        run: pixi run dashboard-quality
      - name: Validate dashboard routes
        run: pixi run dashboard-routes
      - name: Browser smoke gate
        working-directory: apps/dashboard
        run: npm run test:browser
