name: Dashboard browser matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Install Playwright browser engines
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
      - name: Run browser matrix
        working-directory: apps/dashboard
        run: npm run test:browser
      - name: Build checksum-bound review packets
        env:
          PYTHONPATH: .:src
        run: |
          uv run --python 3.14 --no-project --with pydantic==2.13.4 --with defusedxml==0.7.1 \
            python scripts/make_dashboard_review_packet.py
          uv run --python 3.14 --no-project --with pydantic==2.13.4 --with defusedxml==0.7.1 \
            python scripts/make_dashboard_owner_review_packet.py --refresh
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-review-${{ github.run_id }}
          path: |
            apps/test-results/
            apps/playwright-report/
            data/derived/dashboard_review/automated_review_packet.json
            data/derived/dashboard_review/owner_review_packet.json
          if-no-files-found: warn
          retention-days: 30
