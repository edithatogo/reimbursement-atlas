name: Bounded parser fuzzing
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - name: Run reproducible structure-aware fuzzing
        run: pixi run fuzz
