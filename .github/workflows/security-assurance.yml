name: Continuous security assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "${base_url}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" gitleaks
          install --mode 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
      - name: Scan complete Git history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1

  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build twice from the same locked source
        run: |
          set -euo pipefail
          uv build --out-dir dist-a
          uv build --out-dir dist-b
          find dist-a -type f -maxdepth 1 -exec basename {} \; | sort > dist-a-files.txt
          find dist-b -type f -maxdepth 1 -exec basename {} \; | sort > dist-b-files.txt
          diff -u dist-a-files.txt dist-b-files.txt
          while IFS= read -r artifact; do
            cmp "dist-a/${artifact}" "dist-b/${artifact}"
          done < dist-a-files.txt
          sha256sum dist-a/* > reproducible-build-sha256.txt
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-build-evidence
          path: |
            dist-a-files.txt
            dist-b-files.txt
            reproducible-build-sha256.txt
          retention-days: 30
