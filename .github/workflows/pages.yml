name: Publish dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "dashboard-v*"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ""
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Regenerate public status
        run: |
          uv sync --all-extras
          uv run --all-extras python scripts/make_public_status_manifest.py
          uv run --all-extras python scripts/check_public_data_policy.py
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium firefox webkit
      - name: Validate dashboard public quality
        run: uv run --all-extras python scripts/check_dashboard_quality.py
      - name: Validate dashboard routes
        run: uv run --all-extras python scripts/check_dashboard_routes.py
      - name: Browser smoke gate
        working-directory: apps/dashboard
        # The required dashboard-browser workflow runs the complete four-project
        # matrix. Deployment only needs a fast Chromium route smoke check.
        run: npm run test:browser -- --project=desktop-chromium
      - name: Upload dashboard review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-review-evidence-${{ github.run_id }}
          path: |
            apps/playwright-report/
            apps/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Build GitHub Pages artifact
        working-directory: apps/dashboard
        env:
          PUBLIC_DEPLOY_TARGET: github-pages
        run: npm run build
      - name: Validate GitHub Pages asset prefixes
        run: uv run --all-extras python scripts/check_dashboard_pages_assets.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify deployed dashboard
        run: python scripts/check_live_pages.py
